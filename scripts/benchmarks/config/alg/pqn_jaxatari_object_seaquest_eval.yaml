# Plain Seaquest PQN baseline with no ACCEL wrapper or curriculum. The ordinary
# PQN runner still applies LogWrapper and uses its step-based W&B evaluation and
# video callbacks for base plus the same robustness-mod suite as ACCEL runs.

ALG_NAME: "pqn"
NAME: "seaquest_object_base_eval_20m"
TOTAL_TIMESTEPS: 20000000
TOTAL_TIMESTEPS_DECAY: 20000000
NUM_ENVS: 128
NUM_STEPS: 128
EPS_START: 1.0
EPS_FINISH: 0.02
EPS_DECAY: 0.5
NUM_EPOCHS: 5
NUM_MINIBATCHES: 32
NORM_TYPE: "layer_norm"
LR: 2.25e-4
LR_LINEAR_DECAY: true
MAX_GRAD_NORM: 10
GAMMA: 0.99
LAMBDA: 0.65

ENV_NAME: "seaquest"
ENV_KWARGS: {}
OBJECT_CENTRIC: true
TRAIN_MODS: null

EVAL_DURING_TRAINING: true
EVAL_EVERY_STEPS: 1000000
EVAL_NUM_ENVS: 128
EVAL_NUM_STEPS: 10000
# Reuse one held-out stochastic evaluation set across every comparison run.
EVAL_SEED: 20261012
EPS_TEST: 0.0
FINAL_EVAL: true
EVAL_MODS: ["vertical_oscillation", "faster_enemies", "continuous_random_spawns"]
EVAL_RECORD_VIDEO: true
EVAL_VIDEO_BASE: true
EVAL_VIDEO_MODS: true
EVAL_VIDEO_MAX_STEPS: 1000
EVAL_VIDEO_FPS: 30
# FINAL_EVAL already writes video/final/* through the shared W&B video logger.
RECORD_FINAL_VIDEO: false
