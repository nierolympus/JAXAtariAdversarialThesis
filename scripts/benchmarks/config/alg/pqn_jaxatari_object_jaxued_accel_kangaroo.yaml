# Object-centric Kangaroo ACCEL using first-class static-layout PyTrees.
# The launcher varies only ACCEL_KANGAROO_OBJECT_STEP across its three runs.

TOTAL_TIMESTEPS: 15000000
TOTAL_TIMESTEPS_DECAY: 15000000
NUM_ENVS: 128
NUM_STEPS: 128
EPS_START: 1.0
EPS_FINISH: 0.02
EPS_DECAY: 0.5
NUM_EPOCHS: 5
NUM_MINIBATCHES: 32
NORM_TYPE: "layer_norm"
LR: 2.25e-4
LR_LINEAR_DECAY: true
MAX_GRAD_NORM: 10
GAMMA: 0.99
LAMBDA: 0.65

# ENV_NAME automatically selects KangarooAccelWrapper in the shared launcher.
ENV_NAME: "kangaroo"
OBJECT_CENTRIC: true
JAXUED_ALG: "accel"
PROFILE: "object_step8"
ACCEL_LEVEL_ENCODING: "structured"

# A fresh level begins at the canonical three-stage layout and receives zero to
# three fruit/bell x-position edits. A mutation applies one further edit while
# keeping every y-coordinate and all platform/ladder geometry unchanged.
ACCEL_KANGAROO_INITIAL_EDITS: 3
ACCEL_KANGAROO_MUTATION_EDITS: 1
ACCEL_KANGAROO_OBJECT_STEP: 8
ACCEL_BUFFER_CAPACITY: 256
ACCEL_MUTATION_PROB: 0.60

REPLAY_PROB: 0.70
STALENESS_COEFF: 0.35
MINIMUM_FILL_RATIO: 0.35
TEMPERATURE: 1.0
JAXUED_SCORE_FUNCTION: "q_pvl"
EXPLORATORY_GRAD_UPDATES: true
BUFFER_DUPLICATE_CHECK: true

# Evaluate normal Kangaroo and a separate environment locked to level two.
EVAL_DURING_TRAINING: true
EVAL_EVERY_STEPS: 1000000
EVAL_NUM_ENVS: 128
EVAL_NUM_STEPS: 10000
EVAL_SEED: 20261013
FINAL_EVAL: true
EVAL_MODS: ["second_level_only"]
EVAL_RECORD_VIDEO: true
EVAL_VIDEO_BASE: true
EVAL_VIDEO_MODS: true
TRAIN_RECORD_ACCEL_VIDEO: true

HYP_TUNE: false
ENTITY: null
PROJECT: "Thesis"
WANDB_MODE: "online"
SEED: 42
NUM_SEEDS: 1
