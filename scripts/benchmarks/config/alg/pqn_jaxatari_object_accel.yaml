# PQN with ACCEL curriculum learning
NAME_INITIALS: "AC"
ALG_NAME: "pqn_accel"
TOTAL_TIMESTEPS: 1e7
TOTAL_TIMESTEPS_DECAY: 1e7
NUM_ENVS: 128
NUM_STEPS: 128
EPS_START: 1.0
EPS_FINISH: 0.001
EPS_DECAY: 0.1
NUM_EPOCHS: 5
NUM_MINIBATCHES: 32
NORM_TYPE: "layer_norm"
LR: 2.5e-4
MAX_GRAD_NORM: 10
LR_LINEAR_DECAY: False
GAMMA: 0.99
LAMBDA: 0.65

# env specific
ENV_NAME: "pong"
ENV_KWARGS: {}
OBJECT_CENTRIC: True

# Adversarial curriculum (ACCEL)
ADV_RANDOM: True
ADV_WRAPPER: "pong"
ADV_ACCEL: True

# ACCEL specific parameters
ACCEL_BUFFER_CAPACITY: 64
ACCEL_MAX_LEVEL_SIZE: 2
ACCEL_SEED_LEVELS: 4
ACCEL_SAMPLE_TEMPERATURE: 1.0
ACCEL_STRENGTH: 2.0
ACCEL_CONFLICT_GROUPS: null
ACCEL_REPLACEMENT_MARGIN: 0.0

TEST_DURING_TRAINING: False
TEST_INTERVAL: 0.1
TEST_NUM_ENVS: 1024
TEST_NUM_STEPS: 10000
EPS_TEST: 0.0
RECORD_VIDEO: False
LOG_ADVERSARY_VIDEO: False
HYP_TUNE: false

# Add these to your config file:
ENTITY: null # or your wandb username/team
PROJECT: "Thesis"
WANDB_MODE: "online"  # use "disabled" to run without wandb logging
SEED: 42
NUM_SEEDS: 1  # number of random seeds to run