# This is adapted from Atari configuration 
ALG_NAME: "pqn"
TOTAL_TIMESTEPS: 1e8 # 1e8 == 100M, but times 4 (frame-skipping) -> pqn paper: enough to outperform Rainbow
TOTAL_TIMESTEPS_DECAY: 1e8 # will be used for decay functions, in case you want to test for less timesteps and keep decays same
NUM_ENVS: 8192 #512 # parallel environments
NUM_STEPS: 128 # steps per environment in each update
EPS_START: 1.0
EPS_FINISH: 0.001
EPS_DECAY: 0.1
NUM_EPOCHS: 1
NUM_MINIBATCHES: 4096 # match to default (256)
NORM_TYPE: "layer_norm" # layer_norm or batch_norm
# LR: 2.5e-4
LR: 2.5e-3
MAX_GRAD_NORM: 10
LR_LINEAR_DECAY: False #True
GAMMA: 0.99
LAMBDA: 0.65

# env specific
ENV_NAME: "Pong"
ENV_KWARGS: {}
OBJECT_CENTRIC: True
# Apply this mod during testing
# Set to None for training run.
# Activate this for the final test run (or debugging)
TRAIN_MODS: null
EVAL_MODS: null

# Greedy held-out evaluation. This profile is game-agnostic: changing ENV_NAME
# still evaluates that game's unmodified base environment every one million
# learner environment steps. Add game-specific environments through EVAL_MODS.
EVAL_DURING_TRAINING: true
EVAL_EVERY_STEPS: 1000000
EVAL_NUM_ENVS: 128
EVAL_NUM_STEPS: 10000
EVAL_SEED: 20261011
EPS_TEST: 0.0
FINAL_EVAL: true
EVAL_RECORD_VIDEO: true
EVAL_VIDEO_BASE: true
EVAL_VIDEO_MODS: true
EVAL_VIDEO_MAX_STEPS: 1000
EVAL_VIDEO_FPS: 30
