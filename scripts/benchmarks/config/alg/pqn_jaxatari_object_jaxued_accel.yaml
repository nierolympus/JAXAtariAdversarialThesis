# Production PQN + JAXUED ACCEL training for Pong.

# Protagonist learning. Stop shortly after the observed 12M base-return peak,
# but keep the old 20M decay horizon so the first 15M follow the same epsilon
# and learning-rate trajectory as the completed 20M run.
TOTAL_TIMESTEPS: 1.5e7
TOTAL_TIMESTEPS_DECAY: 1.5e7
NUM_ENVS: 128
NUM_STEPS: 128
EPS_START: 1.0
# Pong is sparse-reward, so preserve the completed run's 10M exploration decay.
EPS_FINISH: 0.02
EPS_DECAY: 0.5
NUM_EPOCHS: 5
NUM_MINIBATCHES: 32
NORM_TYPE: "layer_norm"
LR: 2.25e-4
LR_LINEAR_DECAY: true
MAX_GRAD_NORM: 10
GAMMA: 0.99
LAMBDA: 0.65

# Pong pixel observations.
ENV_NAME: "pong"
OBJECT_CENTRIC: false
JAXUED_ALG: "accel"

# ACCEL curriculum: seven physics multipliers plus PH, PW, ES, ET, and EI.
ACCEL_LEVEL_ENCODING: "parameter_vector"
ACCEL_BUFFER_CAPACITY: 1024
# Generate normal Pong often enough to keep a base-Pong anchor.
ACCEL_PARAMETER_BASELINE_PROB: 0.7
# Keep the completed run's 50% mutation probability for this first corrected
# 15M comparison. It yields about two independent rollout updates per replay
# batch before mutation; test 0.25 later as a separate schedule ablation.
ACCEL_MUTATION_PROB: 0.6
# Mutations normally move one coordinate; 5% move two.
ACCEL_MUTATION_MULTI_PARAM_PROB: 0.05
# BX/BY change ball position; VX/VY change ball velocity; PY/EY change paddle
# movement; PS changes player-paddle speed. All seven use these gentle buckets.
ACCEL_PARAMETER_DELTA_MULTIPLIERS: [1,1.05,1.1,1.15,1.2,1.25]
# PH sets the player's paddle height in pixels.
ACCEL_PARAMETER_PADDLE_HEIGHTS: [ 14, 15, 16]
# PW sets the player's paddle width in pixels.
ACCEL_PARAMETER_PADDLE_WIDTHS: [2, 3, 4]
# ES sets the enemy's vertical movement per tracking update; 1 is slower than
# normal Pong's 2 px update.
ACCEL_PARAMETER_ENEMY_STEP_SIZES: [1, 2, 3,4]
# Make the existing lazy_enemy behavior a sampled adversarial ACCEL action.
# Set false to remove it from both parameter-vector levels and legacy masks.
ACCEL_ENABLE_LAZY_ENEMY: false
# LE selects normal tracking (0) or existing lazy_enemy behavior (1): the
# enemy stands still while the ball moves away and tracks only an inbound ball.
ACCEL_PARAMETER_ENEMY_TRACKING_MODES: [0, 1]
# EI changes the tracking cadence: 0 keeps native Pong's seven-of-eight-frame
# schedule; N moves only on every Nth raw frame.
ACCEL_PARAMETER_ENEMY_MOVE_INTERVALS: [0, 1,2,3]
# Legacy mask-only EI setting. Parameter-vector levels use the bins above.
# Fixed wrapper safety rule, not a sampled/mutated ACCEL level coordinate.
# For every level, an incoming ball whose effective native or ACCEL-scaled
# speed exceeds base Pong -- or whose selected ES/EI settings slow the enemy --
# bypasses that slowdown for the raw frame and receives a collision-aligned
# enemy response. No random draw occurs.


ACCEL_ENEMY_MATCH_BALL_SPEED: true
# Fixed wrapper option, not a sampled/mutated ACCEL level coordinate.
# When true, the initial and each post-score serve independently sample vertical
# direction (+1 or -1); horizontal direction remains score-based. This is
# serve-only randomness, not a new draw on every raw frame.
ACCEL_RANDOMIZE_SERVE_DIRECTION: true

# Level sampling and prioritization.
REPLAY_PROB: 0.7
STALENESS_COEFF: 0.35
MINIMUM_FILL_RATIO: 0.35
TEMPERATURE: 1.0
# Dense PLR regret proxy: positive reward-derived Q(lambda) prediction error.
JAXUED_SCORE_FUNCTION: "q_pvl"
# Keep the current learning behavior explicit: fresh and mutated rollouts also
# receive gradients. Test false separately because it changes the algorithm.
EXPLORATORY_GRAD_UPDATES: true

# Evaluation and videos.
EVAL_DURING_TRAINING: true
EVAL_EVERY_STEPS: 1000000
FINAL_EVAL: true
EVAL_RECORD_VIDEO: true
TRAIN_RECORD_ACCEL_VIDEO: true

