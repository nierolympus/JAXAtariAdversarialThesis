# Small smoke-test config for scripts/benchmarks/jaxatari_accel_plr.py.
# This is intentionally tiny and wandb-disabled; use the production config
# once shape/API validation passes.

NAME_INITIALS: "AC"
ALG_NAME: "pqn_jaxued_accel_test"
JAXUED_ALG: "accel"  # "accel" uses new->replay->mutate, "plr" uses new/replay only

TOTAL_TIMESTEPS: 384
TOTAL_TIMESTEPS_DECAY: 384
NUM_ENVS: 4
NUM_STEPS: 16
EPS_START: 1.0
EPS_FINISH: 0.1
EPS_DECAY: 1.0
NUM_EPOCHS: 1
NUM_MINIBATCHES: 1
NORM_TYPE: "layer_norm"
LR: 2.5e-4
MAX_GRAD_NORM: 10
LR_LINEAR_DECAY: False
GAMMA: 0.99
LAMBDA: 0.65

# env specific
ENV_NAME: "pong"
ENV_KWARGS: {}
OBJECT_CENTRIC: True

# JAXAtari adversarial wrapper workflow
ADV_WRAPPER: "pong"
ACCEL_STRENGTH: 2.0
ACCEL_MAX_LEVEL_SIZE: 2
ACCEL_PLAYER_PADDLE_HEIGHT_MULTIPLIER: 1.75

# JAXUED LevelSampler settings
ACCEL_BUFFER_CAPACITY: 16
REPLAY_PROB: 1.0
STALENESS_COEFF: 0.3
MINIMUM_FILL_RATIO: 0.0
PRIORITIZATION: "rank"
TEMPERATURE: 0.3
TOPK_K: 4
BUFFER_DUPLICATE_CHECK: true

# Score for mask levels:
# - q_pvl_all_steps: dense Q-learning PVL proxy, safest for short Atari rollouts
# - pvl: direct jaxued.utils.positive_value_loss(dones, lambda_targets - chosen_q)
# - max_mc: direct jaxued.utils.max_mc
JAXUED_SCORE_FUNCTION: "q_pvl_all_steps"
JAXUED_INCOMPLETE_SCORE: 0.0
EXPLORATORY_GRAD_UPDATES: true

# Periodic eval hook smoke-test settings.
EVAL_DURING_TRAINING: true
EVAL_EVERY_STEPS: 128
FINAL_EVAL: true
EVAL_NUM_ENVS: 4
EVAL_NUM_STEPS: 32
EVAL_MODS: ["lazy_enemy"]
EVAL_RECORD_VIDEO: false
EVAL_VIDEO_BASE: true
EVAL_VIDEO_MODS: true
EVAL_VIDEO_MAX_STEPS: 32
EVAL_VIDEO_FPS: 30
TRAIN_RECORD_ACCEL_VIDEO: false
TRAIN_ACCEL_VIDEO_COUNT: 5
TRAIN_ACCEL_VIDEO_MAX_STEPS: 32
ACCEL_VIDEO_OVERLAY_HEIGHT: 24

HYP_TUNE: false
ENTITY: null
PROJECT: "Thesis"
WANDB_MODE: "disabled"
SEED: 42
NUM_SEEDS: 1
