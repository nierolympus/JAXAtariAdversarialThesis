# Plain object-centric Freeway baseline for the ACCEL comparison matrix.
# Evaluation uses the same held-out base and mod environments as ACCEL.

ALG_NAME: "pqn"
NAME: "freeway_object_base_eval_20m"
TOTAL_TIMESTEPS: 20000000
TOTAL_TIMESTEPS_DECAY: 20000000
NUM_ENVS: 128
NUM_STEPS: 128
EPS_START: 1.0
EPS_FINISH: 0.02
EPS_DECAY: 0.5
NUM_EPOCHS: 5
NUM_MINIBATCHES: 32
NORM_TYPE: "layer_norm"
LR: 2.25e-4
LR_LINEAR_DECAY: true
MAX_GRAD_NORM: 10
GAMMA: 0.99
LAMBDA: 0.65

ENV_NAME: "freeway"
ENV_KWARGS: {}
OBJECT_CENTRIC: true
TRAIN_MODS: null

# pqn_agent evaluates the unmodified game first and then these two mods.
EVAL_DURING_TRAINING: true
EVAL_EVERY_STEPS: 1000000
EVAL_NUM_ENVS: 128
EVAL_NUM_STEPS: 10000
EVAL_SEED: 20261014
EPS_TEST: 0.0
FINAL_EVAL: true
EVAL_MODS: ["slow_cars", "stop_all_cars"]
EVAL_RECORD_VIDEO: true
EVAL_VIDEO_BASE: true
EVAL_VIDEO_MODS: true
RECORD_FINAL_VIDEO: true
