# Smoke-test config for scripts/benchmarks/jaxatari_accel_plr.py with the
# optional JAXUED-style PPO/RNN protagonist path.

NAME_INITIALS: "AC"
ALG_NAME: "jaxued_ppo_accel_test"
JAXUED_ALG: "accel"
PROTAGONIST_ALG: "jaxued_ppo"

TOTAL_TIMESTEPS: 384
TOTAL_TIMESTEPS_DECAY: 384
NUM_ENVS: 4
NUM_STEPS: 16
NUM_EPOCHS: 1
NUM_MINIBATCHES: 1
LR: 1e-4
MAX_GRAD_NORM: 0.5
LR_LINEAR_DECAY: false
GAMMA: 0.995
LAMBDA: 0.98
PPO_CLIP_EPS: 0.2
PPO_ENTROPY_COEFF: 0.001
PPO_CRITIC_COEFF: 0.5
PPO_RNN_HIDDEN_SIZE: 64
PPO_HIDDEN_SIZE: 64

# Unused by PPO, kept because the shared config parser/network branch accepts
# existing benchmark config keys.
EPS_START: 1.0
EPS_FINISH: 0.1
EPS_DECAY: 1.0
NORM_TYPE: "layer_norm"

ENV_NAME: "pong"
ENV_KWARGS: {}
OBJECT_CENTRIC: true

ADV_WRAPPER: "pong"
ACCEL_STRENGTH: 2.0
ACCEL_MAX_LEVEL_SIZE: 2
ACCEL_PLAYER_PADDLE_HEIGHT_MULTIPLIER: 1.75

ACCEL_BUFFER_CAPACITY: 16
REPLAY_PROB: 1.0
STALENESS_COEFF: 0.3
MINIMUM_FILL_RATIO: 0.0
PRIORITIZATION: "rank"
TEMPERATURE: 0.3
TOPK_K: 4
BUFFER_DUPLICATE_CHECK: true

# For PPO this uses jaxued.utils.positive_value_loss(dones, advantages).
JAXUED_SCORE_FUNCTION: "pvl"
JAXUED_INCOMPLETE_SCORE: 0.0
EXPLORATORY_GRAD_UPDATES: false

# Periodic eval hook smoke-test settings.
EVAL_DURING_TRAINING: true
EVAL_EVERY_STEPS: 128
EVAL_NUM_ENVS: 4
EVAL_NUM_STEPS: 32
EVAL_MODS: ["lazy_enemy"]
EVAL_RECORD_VIDEO: false
EVAL_VIDEO_BASE: true
EVAL_VIDEO_MODS: true
EVAL_VIDEO_MAX_STEPS: 32
EVAL_VIDEO_FPS: 30
TRAIN_RECORD_ACCEL_VIDEO: false
TRAIN_ACCEL_VIDEO_COUNT: 5
TRAIN_ACCEL_VIDEO_MAX_STEPS: 32

HYP_TUNE: false
ENTITY: null
PROJECT: "Thesis"
WANDB_MODE: "disabled"
SEED: 42
NUM_SEEDS: 1
