# PQN with random adversarial mod actions via PongStateModWrapper
NAME_INITIALS: "RE"
ALG_NAME: "pqn_adv_random"
TOTAL_TIMESTEPS: 1e7
TOTAL_TIMESTEPS_DECAY: 1e7
NUM_ENVS: 128
NUM_STEPS: 128
EPS_START: 1.0
EPS_FINISH: 0.001
EPS_DECAY: 0.1
NUM_EPOCHS: 5
NUM_MINIBATCHES: 32
NORM_TYPE: "layer_norm"
LR: 2.5e-4
MAX_GRAD_NORM: 10
LR_LINEAR_DECAY: False
GAMMA: 0.99
LAMBDA: 0.65

# env specific
ENV_NAME: "Pong"
ENV_KWARGS: {}
OBJECT_CENTRIC: True

# Adversarial random mod actions
ADV_RANDOM: True
ADV_WRAPPER: "pong"
ADV_MODE: "prob"
ADV_PROB: 0.05


  """
ADV_MODE: \"every_n\"
ADV_EVERY_N: 8
"""


TEST_DURING_TRAINING: False
TEST_INTERVAL: 0.1
TEST_NUM_ENVS: 1024
TEST_NUM_STEPS: 10000
EPS_TEST: 0.0
RECORD_VIDEO: True

