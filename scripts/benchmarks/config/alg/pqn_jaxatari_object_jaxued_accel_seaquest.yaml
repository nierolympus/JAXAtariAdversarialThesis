# Seaquest 32-level mildly perturbed profile derived from the best Pong run.
# The matrix launcher supplies two additional full-profile perturbations while
# keeping the level count, evaluation suite, and 15M-step budget fixed.

TOTAL_TIMESTEPS: 15000000
TOTAL_TIMESTEPS_DECAY: 15000000
NUM_ENVS: 120
NUM_STEPS: 120
EPS_START: 0.98
EPS_FINISH: 0.025
EPS_DECAY: 0.45
NUM_EPOCHS: 4
NUM_MINIBATCHES: 30
NORM_TYPE: "batch_norm"
LR: 2.0e-4
LR_LINEAR_DECAY: false
MAX_GRAD_NORM: 9
GAMMA: 0.985
LAMBDA: 0.60

# Seaquest object observations and game-specific ACCEL wrapper.
ENV_NAME: "seaquest"
ADV_WRAPPER: "seaquest"
OBJECT_CENTRIC: true
JAXUED_ALG: "accel"
PROFILE: "mild"

# Four explicit pre-physics velocity controls. Every list contains the native
# value, so ACCEL's baseline vector is exactly the unmodified Seaquest game:
# player movement=1 px, enemy multiplier=1x, player torpedo=5 px, and enemy
# torpedo multiplier=1x.
ACCEL_LEVEL_ENCODING: "parameter_vector"
ACCEL_PARAMETER_PLAYER_MOVE_SPEEDS: [1, 3]
ACCEL_PARAMETER_ENEMY_SPEED_MULTIPLIERS: [1, 3]
ACCEL_PARAMETER_PLAYER_MISSILE_SPEEDS: [2, 4, 5, 7]
ACCEL_PARAMETER_ENEMY_MISSILE_SPEED_MULTIPLIERS: [1, 3]

# This space contains exactly 2 * 2 * 4 * 2 = 32 parameter combinations.
ACCEL_BUFFER_CAPACITY: 32
ACCEL_PARAMETER_BASELINE_PROB: 0.65
ACCEL_MUTATION_PROB: 0.55
ACCEL_MUTATION_MULTI_PARAM_PROB: 0.08

# Level sampling and prioritization (mildly shifted from the Pong run).
REPLAY_PROB: 0.65
STALENESS_COEFF: 0.30
MINIMUM_FILL_RATIO: 0.30
TEMPERATURE: 0.90
JAXUED_SCORE_FUNCTION: "q_pvl"
EXPLORATORY_GRAD_UPDATES: true

# Evaluate both unmodified Seaquest and its gravity dynamics mod. The runner
# always includes the base environment and adds one evaluation environment for
# every entry in EVAL_MODS.
EVAL_DURING_TRAINING: true
EVAL_EVERY_STEPS: 1000000
EVAL_NUM_ENVS: 128
EVAL_NUM_STEPS: 10000
# Match the baseline's reset/no-op/sticky-action streams at every checkpoint.
EVAL_SEED: 20261012
FINAL_EVAL: true
EVAL_MODS: ["gravity"]
EVAL_RECORD_VIDEO: true
EVAL_VIDEO_BASE: true
EVAL_VIDEO_MODS: true
TRAIN_RECORD_ACCEL_VIDEO: true

HYP_TUNE: false
ENTITY: null
PROJECT: "Thesis"
WANDB_MODE: "online"
SEED: 42
NUM_SEEDS: 1
