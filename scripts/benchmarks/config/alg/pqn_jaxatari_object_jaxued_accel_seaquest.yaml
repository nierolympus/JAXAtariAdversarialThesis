# Object-centric Seaquest ACCEL.  Optimizer, sampler, evaluation, and logging
# settings follow the supplied Pong reference; game-specific profiles only
# change the valid four-coordinate Seaquest velocity grid.

ALG_NAME: "pqn_jaxued_accel"
NAME: "seaquest_object_accel_balanced32_20m"
TOTAL_TIMESTEPS: 20000000
TOTAL_TIMESTEPS_DECAY: 20000000
NUM_ENVS: 128
NUM_STEPS: 128
EPS_START: 1.0
EPS_FINISH: 0.02
EPS_DECAY: 0.5
NUM_EPOCHS: 5
NUM_MINIBATCHES: 32
NORM_TYPE: "layer_norm"
LR: 2.25e-4
LR_LINEAR_DECAY: true
MAX_GRAD_NORM: 10
GAMMA: 0.99
LAMBDA: 0.65

# Seaquest object observations and game-specific ACCEL wrapper.
ENV_NAME: "seaquest"
ADV_WRAPPER: "seaquest"
OBJECT_CENTRIC: true
JAXUED_ALG: "accel"
TRAIN_MODS: null
PROFILE: "balanced32"

# Four explicit pre-physics velocity controls. Every list contains the native
# value, so ACCEL's baseline vector is exactly the unmodified Seaquest game:
# player movement=1 px, enemy multiplier=1x, player torpedo=5 px, and enemy
# torpedo multiplier=1x.
ACCEL_LEVEL_ENCODING: "parameter_vector"
ACCEL_PARAMETER_PLAYER_MOVE_SPEEDS: [1, 2]
ACCEL_PARAMETER_ENEMY_SPEED_MULTIPLIERS: [1, 2]
ACCEL_PARAMETER_PLAYER_MISSILE_SPEEDS: [3, 4, 5, 6]
ACCEL_PARAMETER_ENEMY_MISSILE_SPEED_MULTIPLIERS: [1, 2]

# This space contains exactly 2 * 2 * 4 * 2 = 32 parameter combinations.
ACCEL_BUFFER_CAPACITY: 32
ACCEL_PARAMETER_BASELINE_PROB: 0.70
ACCEL_MUTATION_PROB: 0.60
ACCEL_MUTATION_MULTI_PARAM_PROB: 0.05

# Level sampling and prioritization copied from the Pong reference.
REPLAY_PROB: 0.70
STALENESS_COEFF: 0.35
MINIMUM_FILL_RATIO: 0.35
TEMPERATURE: 1.0
JAXUED_SCORE_FUNCTION: "q_pvl"
EXPLORATORY_GRAD_UPDATES: true
BUFFER_DUPLICATE_CHECK: true

# Evaluate unmodified Seaquest plus three held-out robustness mods. The runner
# always includes the base environment and adds one evaluation environment for
# every entry in EVAL_MODS.
EVAL_DURING_TRAINING: true
EVAL_EVERY_STEPS: 1000000
EVAL_NUM_ENVS: 128
EVAL_NUM_STEPS: 10000
# Match the baseline's reset/no-op/sticky-action streams at every checkpoint.
EVAL_SEED: 20261012
FINAL_EVAL: true
EVAL_MODS: ["vertical_oscillation", "faster_enemies", "continuous_random_spawns"]
EPS_TEST: 0.0
EVAL_RECORD_VIDEO: true
EVAL_VIDEO_BASE: true
EVAL_VIDEO_MODS: true
EVAL_VIDEO_MAX_STEPS: 1000
EVAL_VIDEO_FPS: 30
TRAIN_RECORD_ACCEL_VIDEO: true

HYP_TUNE: false
ENTITY: null
PROJECT: "Thesis"
WANDB_MODE: "online"
SAVE_PATH: null
SEED: 42
NUM_SEEDS: 1
