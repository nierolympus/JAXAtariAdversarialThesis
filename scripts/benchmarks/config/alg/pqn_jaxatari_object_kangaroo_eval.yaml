# Plain object-centric Kangaroo baseline for the structured-layout comparison.
# Evaluation covers the normal game and an isolated second-level environment.

ALG_NAME: "pqn"
NAME: "kangaroo_object_base"
TOTAL_TIMESTEPS: 15000000
TOTAL_TIMESTEPS_DECAY: 15000000
NUM_ENVS: 128
NUM_STEPS: 128
EPS_START: 1.0
EPS_FINISH: 0.02
EPS_DECAY: 0.5
NUM_EPOCHS: 5
NUM_MINIBATCHES: 32
NORM_TYPE: "layer_norm"
LR: 2.25e-4
LR_LINEAR_DECAY: true
MAX_GRAD_NORM: 10
GAMMA: 0.99
LAMBDA: 0.65

ENV_NAME: "kangaroo"
ENV_KWARGS: {}
OBJECT_CENTRIC: true
TRAIN_MODS: null

EVAL_DURING_TRAINING: true
EVAL_EVERY_STEPS: 1000000
EVAL_NUM_ENVS: 128
EVAL_NUM_STEPS: 10000
EVAL_SEED: 20261013
EPS_TEST: 0.0
FINAL_EVAL: true
# pqn_agent always evaluates the base environment first, then every entry here.
EVAL_MODS: ["second_level_only"]
EVAL_RECORD_VIDEO: true
EVAL_VIDEO_BASE: true
EVAL_VIDEO_MODS: true
RECORD_FINAL_VIDEO: true
